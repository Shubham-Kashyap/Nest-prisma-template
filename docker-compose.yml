

services:
  mongodb:
    image: mongo:latest
    container_name: nest_mongodb
    ports:
      - "${MONGODB_PORT:-27017}:${MONGODB_PORT:-27017}"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: nest_redis
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"

  app:
    build: .
    container_name: nest_app
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:${MONGODB_PORT:-27017}/$MONGODB_DB_NAME
      - REDIS_URL=redis://redis:${REDIS_PORT:-6379}
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
